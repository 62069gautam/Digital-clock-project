<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="clock">
        <h1>Digital Clock</h1>

        <div class="time">
            <span id="hours">00</span>
            <span>:</span>
            <span id="minutes">00</span>
            <span>:</span>
            <span id="seconds">00</span>
        </div>

        <div class="date">
            <span id="day"></span>,
            <span id="month"></span>
            <span id="dateNum"></span>,
            <span id="year"></span>
        </div>

        <div class="ampm" id="ampm"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
